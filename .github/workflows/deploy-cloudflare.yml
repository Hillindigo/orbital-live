name: Deploy to Cloudflare

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

env:
  NODE_VERSION: "22.14"
  PRODUCTION_URL: https://orbital-live.1hillindigo.workers.dev

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build and test
        run: npm test

      - name: Store deployment package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: cloudflare-build
          path: dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ env.PRODUCTION_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore deployment package
        uses: actions/download-artifact@v7
        with:
          name: cloudflare-build
          path: dist

      - name: Validate deployment credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "::error::Missing production secret CLOUDFLARE_API_TOKEN"
            exit 1
          }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "::error::Missing repository variable CLOUDFLARE_ACCOUNT_ID"
            exit 1
          }

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config dist/server/wrangler.json

      - name: Smoke-test production
        shell: bash
        run: |
          headers="$(mktemp)"
          body="$(mktemp)"

          curl --fail --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 5 \
            --max-time 30 \
            "$PRODUCTION_URL/" \
            --output /dev/null

          curl --fail --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 5 \
            --max-time 30 \
            --dump-header "$headers" \
            "$PRODUCTION_URL/api/tle?group=stations" \
            --output "$body"

          grep --ignore-case --quiet '^x-orbital-record-count:' "$headers"
          test "$(wc -l < "$body")" -ge 3
